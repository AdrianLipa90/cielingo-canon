name: CIELingo GREMLIN Genomic Grammar CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  genomic-grammar-bridge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run genomic grammar and GREMLIN bridge tests
        env:
          PYTHONPATH: src:data/lingophysics/src
        run: python -m pytest -q tests/test_genomic_gremlin_bridge.py
