name: CIELingo GREMLIN Genomic Grammar CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  genomic-grammar-bridge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run genomic grammar and GREMLIN bridge tests
        env:
          PYTHONPATH: src:data/lingophysics/src
        run: python -m pytest -q tests/test_genomic_gremlin_bridge.py tests/test_genomic_phase_scan.py

  gremlin-live-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CIELingo
        uses: actions/checkout@v4
      - name: Checkout pinned GREMLIN
        uses: actions/checkout@v4
        with:
          repository: AdrianLipa90/GREMLIN
          ref: 86059ead6177fbb5bf33211f674781883a149a57
          path: gremlin-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GREMLIN and test runner
        run: |
          python -m pip install pytest
          python -m pip install ./gremlin-src
      - name: Run real GREMLIN server_with_hive E2E
        env:
          PYTHONPATH: src:data/lingophysics/src
          CIELINGO_GREMLIN_E2E: "1"
        run: python -m pytest -q tests/test_gremlin_live_surface_e2e.py
