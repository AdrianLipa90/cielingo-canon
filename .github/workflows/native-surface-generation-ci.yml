name: Native CIEL Surface Generator CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/native-surface-generation-v0.4]

jobs:
  generator-invariants:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Import native generator API
        env:
          PYTHONPATH: src:data/lingophysics/src
        run: >-
          python -c "from cielingo_core.generation import
          CanonicalLingophysicsRoundTripAdapter,
          CielingoLingophysicsRoundTripValidator,
          NativeSurfaceGenerationEndpoint;
          from cielingo_core.language_spaces.pl.response_realizer import realize_pl_response;
          print(CanonicalLingophysicsRoundTripAdapter,
          CielingoLingophysicsRoundTripValidator,
          NativeSurfaceGenerationEndpoint, realize_pl_response)"
      - name: Run generator invariant suite
        env:
          PYTHONPATH: src:data/lingophysics/src
        run: >-
          python -m pytest -q
          tests/test_native_surface_generation.py
          tests/test_native_roundtrip_adapter.py
          tests/test_canonical_lingophysics_adapter.py
