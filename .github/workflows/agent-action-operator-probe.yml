name: Agent action operator v0.2 one-shot probe

on:
  push:
    branches:
      - feat/agent-action-operator-family-v0.2

permissions:
  contents: read

jobs:
  action-family-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile typed action modules
        env:
          PYTHONPATH: src:data/lingophysics/src
        run: python -m compileall -q src/cielingo_core/lingophysics
      - name: Run action and typed-relation regression gate
        env:
          PYTHONPATH: src:data/lingophysics/src
        run: >-
          python -m pytest -q
          tests/test_agent_action_operator_family_v02.py
          tests/test_operator_signatures.py
          tests/test_operator_signature_fail_closed.py
          tests/test_meaning_role_multimap.py
          tests/test_relation_hypergraph.py
          tests/test_relation_entity_card_bindings.py
